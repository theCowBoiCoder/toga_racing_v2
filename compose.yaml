services:
  app:
    build: .
    container_name: toga-racing-v2
    ports:
      - "8083:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8083
      LOG_CHANNEL: stderr
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_PROFILE_URL: ${INSTAGRAM_PROFILE_URL:-https://www.instagram.com/toga_racing/}
      INSTAGRAM_ALTERNATE_POSTS: ${INSTAGRAM_ALTERNATE_POSTS:-Dai8OYnDFzk,Dai8K2AjDL5}
      ENQUIRY_NOTIFICATION_EMAIL: ${ENQUIRY_NOTIFICATION_EMAIL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_RESULTS_ADMIN_USER_ID: ${DISCORD_RESULTS_ADMIN_USER_ID:-321560062231314443}
      DISCORD_PARTNER_CHANNEL_ID: ${DISCORD_PARTNER_CHANNEL_ID:-1527599240405323887}
      DISCORD_DRIVER_CHANNEL_ID: ${DISCORD_DRIVER_CHANNEL_ID:-1527599269392023633}
      DISCORD_RACE_RESULTS_CHANNEL_ID: ${DISCORD_RACE_RESULTS_CHANNEL_ID:-1538240961375633559}
      DISCORD_STINT_CHANNEL_ID: ${DISCORD_STINT_CHANNEL_ID:-}
      STINT_PLANNER_SHARE_KEY: ${STINT_PLANNER_SHARE_KEY:-}
    restart: unless-stopped

  queue:
    build: .
    container_name: toga-racing-v2-queue
    command: php artisan queue:work database --queue=emails --sleep=1 --tries=3 --timeout=30
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
    restart: unless-stopped
