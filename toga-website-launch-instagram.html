<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toga Racing — New Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #100e0e; font-family: Montserrat, Arial, sans-serif; }
    .page {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      color: #ededed;
      background: #100e0e;
    }
    .photo {
      position: absolute;
      inset: 0 0 auto 0;
      width: 1080px;
      height: 608px;
      object-fit: contain;
      background: #100e0e;
    }
    .photo-scrim {
      position: absolute;
      inset: 0 0 auto 0;
      width: 1080px;
      height: 608px;
      background: linear-gradient(0deg, #1a0b4c 0%, rgba(26,11,76,.28) 30%, rgba(16,14,14,.03) 70%);
    }
    .panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 500px;
      padding: 62px 72px 58px;
      background: linear-gradient(135deg, #1a0b4c 0%, #26145c 58%, #100e0e 130%);
      border-top: 1px solid rgba(237,237,237,.28);
    }
    .eyebrow { font-size: 18px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 24px; }
    h1 { margin: 0; max-width: 900px; font-size: 92px; line-height: .88; letter-spacing: -.065em; font-weight: 900; text-transform: uppercase; }
    .footer { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; align-items: center; justify-content: space-between; }
    .support { margin: 0; font-size: 19px; line-height: 1.5; color: #c9c3da; font-weight: 400; }
    .cta { padding: 18px 23px; color: #100e0e; background: #ededed; border: 1px solid #ededed; border-radius: 3px; font-size: 16px; font-weight: 900; letter-spacing: .08em; white-space: nowrap; }
    .mark { position: absolute; top: 42px; left: 52px; height: 74px; width: 74px; object-fit: contain; }
  </style>
</head>
<body>
  <section class="page" data-document-role="page" data-label="Toga Racing website launch">
    <img class="photo" src="https://togaracing.co.uk/images/gallery/race-1.jpg" alt="Toga Motorsport Porsche number 39 racing in iRacing">
    <div class="photo-scrim"></div>
    <img class="mark" src="https://togaracing.co.uk/images/logo.png" alt="Toga Racing">
    <div class="panel">
      <div class="eyebrow">TOGA RACING • SIM RACING TEAM</div>
      <h1>NEW SITE.<br>SAME DRIVE.</h1>
      <div class="footer">
        <p class="support">The new home of Toga Racing is live.</p>
        <div class="cta">TOGARACING.CO.UK →</div>
      </div>
    </div>
  </section>
</body>
</html>
